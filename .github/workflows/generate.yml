name: LeetCode Profile Stats

on:
  schedule:
    # Automatically run daily at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      username:
        description: 'LeetCode username'
        required: true
        default: 'gufran21'
      theme:
        description: 'Theme name'
        required: false
        default: 'github_dark'

jobs:
  leetcode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate LeetCode Profile Cards
        uses: gufran21/leetcode-profile-generator@v1
        with:
          username: ${{ github.event.inputs.username || 'gufran21' }}
          theme: ${{ github.event.inputs.theme || 'github_dark' }}
          output_dir: 'assets'
          auto_commit: 'true'
